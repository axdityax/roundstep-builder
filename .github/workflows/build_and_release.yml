name: Build and Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g. 2.1.0)"
        required: true
        default: "2.1.0"
      target_platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - macos
          - windows

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon aarch64)
    if: github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'macos'
    runs-on: macos-latest
    env:
      VITE_API_URL: https://api.roundstep.com
      VITE_RAZORPAY_KEY_ID: rzp_live_TjmpaxH7nuHT94
      VITE_FIREBASE_API_KEY: AIzaSyDFpx_eEVlvVfc175GC0cspokaQZABrzm8
      VITE_FIREBASE_AUTH_DOMAIN: roundstep-b22c3.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: roundstep-b22c3
      VITE_FIREBASE_STORAGE_BUCKET: roundstep-b22c3.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: 679163084023
      VITE_FIREBASE_APP_ID: 1:679163084023:web:f5f1526a396c258d94e7f2
      VITE_GA_MEASUREMENT_ID: G-VCL345DK0L
      VITE_FIREBASE_OAUTH_CLIENT_ID: 521672628030-salvmpnvp31kd2g9rtak34tua1gr1vg5.apps.googleusercontent.com
      ROUNDSTEP_MODEL_SECRET: ${{ secrets.ROUNDSTEP_MODEL_SECRET || '' }}

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: "axdityax/roundstep-desktop"
          token: ${{ secrets.PUBLIC_RELEASE_PAT }}
          lfs: true

      - name: Update version numbers in source
        shell: bash
        run: |
          TARGET_VER="${{ github.event.inputs.version || '2.1.0' }}"
          echo "Updating version to $TARGET_VER in client-desktop-mac..."
          node -e "
            const fs = require('fs');
            const pkgPath = 'client-desktop-mac/package.json';
            const tauriPath = 'client-desktop-mac/src-tauri/tauri.conf.json';
            if (fs.existsSync(pkgPath)) {
              const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
              pkg.version = '$TARGET_VER';
              fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\\n');
            }
            if (fs.existsSync(tauriPath)) {
              const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
              tauri.version = '$TARGET_VER';
              fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\\n');
            }
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client-desktop-mac/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client-desktop-mac/src-tauri

      - name: Install Node dependencies
        working-directory: ./client-desktop-mac
        run: npm ci

      - name: Prepare macOS portable environment
        run: |
          chmod +x client-desktop-mac/src-tauri/setup_portable_envs.sh
          cd client-desktop-mac/src-tauri && ./setup_portable_envs.sh

      - name: Import Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Deep sign nested Python libraries and sidecars
        shell: bash
        run: |
          IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
          echo "Signing all embedded .so, .dylib, and binaries with: $IDENTITY"
          find client-desktop-mac/src-tauri/resources/python-macos -type f \( -name "*.so" -o -name "*.dylib" -o -name "python3*" \) | while read -r file; do
            codesign --force --timestamp --options runtime --sign "$IDENTITY" "$file" 2>&1 || true
          done
          if [ -f "client-desktop-mac/src-tauri/bin/speech_engine-aarch64-apple-darwin" ]; then
            codesign --force --timestamp --options runtime --sign "$IDENTITY" "client-desktop-mac/src-tauri/bin/speech_engine-aarch64-apple-darwin" 2>&1 || true
          fi
          echo "OK: All embedded binaries and libraries signed."

      - name: Build and publish Tauri release (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          ENABLE_CODE_SIGNING: "true"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          owner: axdityax
          repo: roundstep-releases
          releaseCommitish: main
          projectPath: ./client-desktop-mac
          tagName: "v${{ github.event.inputs.version || '2.1.0' }}"
          releaseName: "Roundstep Desktop v${{ github.event.inputs.version || '2.1.0' }}"
          releaseBody: "Roundstep Desktop official release with automated updater support."
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Asynchronous Apple Notarization
        shell: bash
        run: |
          echo "Submitting DMG to Apple Notary service asynchronously (no hang)..."
          DMG_PATH=$(find client-desktop-mac/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ] && [ -f "$DMG_PATH" ]; then
            echo "Submitting $DMG_PATH to Apple Notary Service..."
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --password "${{ secrets.APPLE_PASSWORD }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" || true
          else
            echo "No DMG found to submit."
          fi

  build-windows:
    name: Build Windows (x64)
    if: github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'windows'
    runs-on: windows-latest
    env:
      VITE_API_URL: https://api.roundstep.com
      VITE_RAZORPAY_KEY_ID: rzp_live_TjmpaxH7nuHT94
      VITE_FIREBASE_API_KEY: AIzaSyDFpx_eEVlvVfc175GC0cspokaQZABrzm8
      VITE_FIREBASE_AUTH_DOMAIN: roundstep-b22c3.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: roundstep-b22c3
      VITE_FIREBASE_STORAGE_BUCKET: roundstep-b22c3.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: 679163084023
      VITE_FIREBASE_APP_ID: 1:679163084023:web:f5f1526a396c258d94e7f2
      VITE_GA_MEASUREMENT_ID: G-VCL345DK0L
      VITE_FIREBASE_OAUTH_CLIENT_ID: 521672628030-salvmpnvp31kd2g9rtak34tua1gr1vg5.apps.googleusercontent.com
      ROUNDSTEP_MODEL_SECRET: ${{ secrets.ROUNDSTEP_MODEL_SECRET || '' }}

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: "axdityax/roundstep-desktop"
          token: ${{ secrets.PUBLIC_RELEASE_PAT }}
          lfs: true

      - name: Update version numbers in source
        shell: bash
        run: |
          TARGET_VER="${{ github.event.inputs.version || '2.1.0' }}"
          echo "Updating version to $TARGET_VER in client-desktop-windows..."
          node -e "
            const fs = require('fs');
            const pkgPath = 'client-desktop-windows/package.json';
            const tauriPath = 'client-desktop-windows/src-tauri/tauri.conf.json';
            if (fs.existsSync(pkgPath)) {
              const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
              pkg.version = '$TARGET_VER';
              fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\\n');
            }
            if (fs.existsSync(tauriPath)) {
              const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
              tauri.version = '$TARGET_VER';
              fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\\n');
            }
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client-desktop-windows/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client-desktop-windows/src-tauri

      - name: Install Node dependencies
        working-directory: ./client-desktop-windows
        run: npm ci

      - name: Prepare Windows sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binDir = "client-desktop-windows/src-tauri/bin"
          New-Item -ItemType Directory -Force -Path $binDir

          Write-Host "Building static speech_engine for Windows x64..."
          $tmpDir = Join-Path $env:TEMP "whisper-src"
          if (Test-Path $tmpDir) { Remove-Item -Recurse -Force $tmpDir }
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git $tmpDir
          cmake -B "$tmpDir/build" -S "$tmpDir" -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF -DWHISPER_NATIVE=OFF -DGGML_AVX512=OFF -DWHISPER_AVX512=OFF -DGGML_AVX2=ON -DWHISPER_AVX2=ON -DGGML_FMA=ON -DWHISPER_FMA=ON -DGGML_AVX=ON -DWHISPER_AVX=ON
          cmake --build "$tmpDir/build" --config Release -j 4

          $speechExe = Get-ChildItem -Path "$tmpDir/build" -Filter "whisper-cli.exe" -Recurse | Select-Object -First 1
          if (-not $speechExe) {
              $speechExe = Get-ChildItem -Path "$tmpDir/build" -Filter "main.exe" -Recurse | Select-Object -First 1
          }
          if (-not $speechExe) {
              throw "Failed to find built speech_engine executable"
          }
          Write-Host "Found built static speech executable at: $($speechExe.FullName)"
          Copy-Item -Path $speechExe.FullName -Destination "$binDir/speech_engine-x86_64-pc-windows-msvc.exe" -Force
          Remove-Item -Recurse -Force $tmpDir

          $resDir = "client-desktop-windows/src-tauri/resources"
          $pyWinDir = "$resDir/python-windows"
          if (-not (Test-Path $pyWinDir)) {
              New-Item -ItemType Directory -Force -Path $pyWinDir
              $pyUrl = "https://www.python.org/ftp/python/3.10.11/python-3.10.11-embed-amd64.zip"
              Write-Host "Downloading embeddable Python for Windows..."
              Invoke-WebRequest -Uri $pyUrl -OutFile "python-win.zip"
              Expand-Archive -Path "python-win.zip" -DestinationPath $pyWinDir -Force

              $pthFile = "$pyWinDir/python310._pth"
              if (Test-Path $pthFile) {
                  (Get-Content $pthFile) -replace '#import site', 'import site' | Set-Content $pthFile
              }

              Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "$pyWinDir/get-pip.py"
              & "$pyWinDir/python.exe" "$pyWinDir/get-pip.py"
              & "$pyWinDir/python.exe" -m pip install piper-tts
          }

          $speechTarget = "$binDir/speech_engine-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $speechTarget)) { throw "Missing Tauri Speech sidecar: $speechTarget" }
          Write-Host "OK: speech_engine sidecar exists"
          Get-ChildItem -Path $binDir | Format-Table Name, Length

      - name: Build and publish Tauri release (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          owner: axdityax
          repo: roundstep-releases
          releaseCommitish: main
          projectPath: ./client-desktop-windows
          tagName: "v${{ github.event.inputs.version || '2.1.0' }}"
          releaseName: "Roundstep Desktop v${{ github.event.inputs.version || '2.1.0' }}"
          releaseBody: "Roundstep Desktop official release with automated updater support."
          releaseDraft: false
          prerelease: false
